
<!DOCTYPE html>
<html>
<head>
  <title>Gravity Cars Zanzibar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b0b0b;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 15px 30px;
      background: black;
      align-items: center;
    }

    header h2 {
      color: #00ff66;
    }

    nav a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(black, #003300);
    }

    .hero h1 {
      font-size: 40px;
      color: #00ff66;
    }

    .btn {
      padding: 12px 25px;
      background: #00ff66;
      color: black;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    .cars {
      padding: 40px;
      text-align: center;
    }

    .car {
      background: #111;
      margin: 15px;
      padding: 20px;
      border-radius: 10px;
    }

    footer {
      background: black;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h2>🚗 Gravity Cars</h2>
  <nav>
    <a href="#">Home</a>
    <a href="#">Cars</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h1>Rent a Car in Zanzibar</h1>
  <p>Driven by Trust. Moved by Quality.</p>
  <button class="btn">Book Now</button>
</section>

<section class="cars">
  <h2>Our Cars</h2>

  <div class="car">
    <h3>Toyota Prado</h3>
    <p>$80/day</p>
  </div>

  <div class="car">
    <h3>Suzuki Alto</h3>
    <p>$30/day</p>
  </div>

</section>

<footer>
  <p>© Gravity Cars Zanzibar</p>
</footer>

</body>
</html>
