
<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;

    }

    header {
      display: flex;

    .btn {

    .cars {

    }

    footer {

    .hero {
  position: relative;
  height: 80vh;
  overflow: hidden;
}

.slides {
  height: 100%;
  position: relative;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: 1s;
}

.slide.active {
  opacity: 1;
}

.overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.overlay h1 {
  font-size: 40px;
  color: #00ff66;
}
    .car-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.car img {
  width: 100%;
  border-radius: 10px;
}

.car {
  background: #111;
  padding: 15px;
  border-radius: 10px;
}
    .booking {
  padding: 40px;
  text-align: center;
}

.booking input {
  padding: 10px;
  width: 250px;
}
  </style>
</head>

<body>

<header>
<img src="logo.png" style="height:50px;">
  <nav>

</header>
<section class="hero">

    <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1503376780353-7e6692767b70');"></div>
  </div>

  <div class="overlay">
    <h1>Drive Zanzibar in Style</h1>
    <p>Reliable • Affordable • 24/7 Service</p>

</div>
</section>

<section class="cars">
  <h2>Our Cars</h2>
 <div class="car-grid">

  <div class="car">
    <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d">
    <h3>Toyota Prado</h3>

    <a href="https://wa.me/255712484116?text=Hello%20Gravity%20Cars%20Zanzibar,%20I%20want%20to%20book%20Toyota%20Prado">

  <div class="car">
    <img src="https://images.unsplash.com/photo-1549924231-f129b911e442">
    <h3>Suzuki Alto</h3>

    <a href="https://wa.me/255712484116?text=Hello%20Gravity%20Cars%20Zanzibar,%20I%20want%20to%20book%20Suzuki%20Alto">
      <button class="btn">Book on WhatsApp</button>
    </a>

  <div class="car">
    <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c">
    <h3>Toyota Noah</h3>

    <a href="https://wa.me/255712484116?text=Hello%20Gravity%20Cars%20Zanzibar,%20I%20want%20to%20book%20Toyota%20Noah">
      <button class="btn">Book on WhatsApp</button>
    </a>
  </div>

</div>
</section>

<section class="booking">
<section class="booking">
  <h2>Book Your Car</h2>

  <input id="name" placeholder="Your Name"><br><br>
  <input id="phone" placeholder="Phone Number"><br><br>
  <input id="car" placeholder="Car Name"><br><br>

  <button class="btn" onclick="bookCar()">Submit Booking</button>
</section>

<!-- 👇 HAPA NDIPO UNAWEKA -->
<h2>Admin - Bookings</h2>
<button class="btn" onclick="loadBookings()">Load Bookings</button>
<div id="bookingsList"></div>

<!-- Footer -->
<footer>
  <p>© Gravity Cars Zanzibar</p>
</footer>
  

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  "https://dhkriuptozyqoyfezkpc.supabase.co",
  "sb_publishable_oafog08NEEQ2QHlp6d3dYw_fWTOlZlh"
);

// BOOK CAR
async function bookCar() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const car = document.getElementById("car").value;

  if (!name || !phone || !car) {
    alert("Please fill all fields");
    return;
  }

  const { error } = await supabaseClient
    .from("Booking")
    .insert([{ Name: name, Phone: phone, Car: car }]);

  if (error) {
    alert("Error: " + error.message);
  } else {
    alert("Booking saved!");
  }

async function loadBookings() {
  const { data, error } = await supabaseClient
    .from("Booking")
    .select("*");

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  if (!data || data.length === 0) {
    document.getElementById("bookingsList").innerHTML = "<p>No bookings yet</p>";
    return;
  }

  document.getElementById("bookingsList").innerHTML =
    data.map(b => `
      <div style="background:#111; margin:10px; padding:15px; border-radius:10px;">
        <strong>${b.Name}</strong><br>
        Phone: ${b.Phone}<br>
        Car: ${b.Car}
      </div>
    `).join("");
}
}
</script>

</body>
