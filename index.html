
<!DOCTYPE html>
<html>
<head>
  <title>Gravity Cars Zanzibar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 8%;
    background: rgba(0,0,0,0.9);
    border-bottom: 1px solid #0bbf4f;
  }

  header img {
    height: 55px;
  }

  nav a {
    margin-left: 20px;
    color: white;
    text-decoration: none;
    font-weight: bold;
  }

  nav a:hover {
    color: #00ff66;
  }

  .hero {
    position: relative;
    height: 85vh;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1s ease;
  }

  .slide.active {
    opacity: 1;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.85), rgba(0,60,20,0.45));
  }

  .overlay {
    position: absolute;
    z-index: 2;
    top: 50%;
    left: 8%;
    transform: translateY(-50%);
    max-width: 550px;
    text-align: left;
  }

  .overlay h1 {
    font-size: 52px;
    margin: 0;
    color: #00ff66;
  }

  .overlay p {
    font-size: 22px;
    line-height: 1.5;
  }

  .btn {
    padding: 14px 28px;
    background: #00ff66;
    color: black;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    margin-top: 15px;
  }
.btn:hover {
    background: #18c95c;
  }
</style>
</head>

<body>

<header>
<img src="logo.png" style="height:50px;">
  <nav>
    <a href="#">Home</a>
    <a href="#">Cars</a>
    <a href="#">Contact</a>
  </nav>
</header>
<section class="hero">

  <div class="slides">
    <div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1502877338535-766e1452684a');"></div>
    <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1494976388531-d1058494cdd8');"></div>
    <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1503376780353-7e6692767b70');"></div>
  </div>

  <div class="overlay">
    <h1>Drive Zanzibar in Style</h1>
    <p>Reliable • Affordable • 24/7 Service</p>

</div>
</section>

<section class="cars">
  <h2>Our Cars</h2>
 <div class="car-grid">

  <div class="car">
    <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d">
    <h3>Toyota Prado</h3>
    <p>$80/day</p>
    <a href="https://wa.me/255712484116?text=Hello%20Gravity%20Cars%20Zanzibar,%20I%20want%20to%20book%20Toyota%20Prado">
      <button class="btn">Book on WhatsApp</button>
    </a>
  </div>

  <div class="car">
    <img src="https://images.unsplash.com/photo-1549924231-f129b911e442">
    <h3>Suzuki Alto</h3>
    <p>$30/day</p>
    <a href="https://wa.me/255712484116?text=Hello%20Gravity%20Cars%20Zanzibar,%20I%20want%20to%20book%20Suzuki%20Alto">
      <button class="btn">Book on WhatsApp</button>
    </a>
  </div>

  <div class="car">
    <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c">
    <h3>Toyota Noah</h3>
    <p>$50/day</p>
    <a href="https://wa.me/255712484116?text=Hello%20Gravity%20Cars%20Zanzibar,%20I%20want%20to%20book%20Toyota%20Noah">
      <button class="btn">Book on WhatsApp</button>
    </a>
  </div>

</div>
</section>

<section class="booking">
  <h2>Book Your Car</h2>

  <input id="name" placeholder="Your Name"><br><br>
  <input id="phone" placeholder="Phone Number"><br><br>
  <input id="car" placeholder="Car Name"><br><br>

  <button class="btn" onclick="bookCar()">Submit Booking</button>
</section>

<!-- 👇 HAPA NDIPO UNAWEKA -->
<h2>Admin - Bookings</h2>
<button class="btn" onclick="loadBookings()">Load Bookings</button>
<div id="bookingsList"></div>

<!-- Footer -->
<footer>
  <p>© Gravity Cars Zanzibar</p>
</footer>
  

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  "https://dhkriuptozyqoyfezkpc.supabase.co",
  "sb_publishable_oafog08NEEQ2QHlp6d3dYw_fWTOlZlh"
);

async function bookCar() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const car = document.getElementById("car").value;

  if (!name || !phone || !car) {
    alert("Please fill all fields");
    return;
  }

  const { error } = await supabaseClient
    .from("Booking")
    .insert([{ Name: name, Phone: phone, Car: car }]);

  if (error) {
    alert("Error: " + error.message);
  } else {
    alert("Booking saved!");
  }
}

async function loadBookings() {
  alert("imeanza");

  const { data, error } = await supabaseClient
    .from("Booking")
    .select("*");

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  alert("data length: " + data.length);

  document.getElementById("bookingsList").innerHTML =
    data.map(b => `
      <div style="background:#111; margin:10px; padding:10px;">
        ${b.Name} - ${b.Phone} - ${b.Car}
      </div>
    `).join("");
}
</script>
</body>
</html>
