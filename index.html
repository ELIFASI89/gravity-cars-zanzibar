
<!DOCTYPE html>

  <style>
    body {

    .hero {
  position: relative;
  height: 80vh;
  overflow: hidden;
}

.slides {
  height: 100%;
  position: relative;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: 1s;
}

.slide.active {
  opacity: 1;
}

.overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

}

.overlay h1 {
  font-size: 40px;
  color: #00ff66;
}
    .car-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.car img {
  width: 100%;
  border-radius: 10px;
}

.car {
  background: #111;
  padding: 15px;
  border-radius: 10px;
}
    .booking {
  padding: 40px;
  text-align: center;
}

.booking input {
  padding: 10px;
  width: 250px;
}
  </style>
</head>

<body>

<header>
<img src="logo.png" style="height:50px;">
  <nav>

</header>
<section class="hero">

    <div class="slide active" style="background-image:url('https://images.unsplash.com/photo-1502877338535-766e1452684a');"></div>

  </div>

  <div class="overlay">

    <a href="https://wa.me/255712484116">

</section>

<section class="cars">
  <h2>Our Cars</h2>

  <div class="car-grid">

    <div class="car">
      <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d">

      <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c">
      <h3>Toyota Noah</h3>

      <a href="https://wa.me/255712484116"><button class="btn">Book Now</button></a>

<section class="booking">
  <h2>Book Your Car</h2>

  <input id="name" placeholder="Your Name"><br><br>
  <input id="phone" placeholder="Phone Number"><br><br>
  <input id="car" placeholder="Car Name"><br><br>

  <button class="btn" onclick="bookCar()">Submit Booking</button>
</section>
  </div>
</section>

<footer>
  <p>© Gravity Cars Zanzibar</p>
</footer>
<a href="https://wa.me/255712484116" 
   style="position:fixed; bottom:20px; right:20px; background:#25D366; color:white; padding:15px; border-radius:50%;">
   💬
</a>
</body>
  <script>
let slides = document.querySelectorAll('.slide');
let index = 0;

setInterval(() => {
  slides[index].classList.remove('active');
  index = (index + 1) % slides.length;
  slides[index].classList.add('active');
}, 3000);

const supabase = window.supabase.createClient(
  "https://dhkriuptozyqoyfezkpc.supabase.co",
  "sb_publishable_YOUR_KEY"
);

async function bookCar() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const car = document.getElementById("car").value;

  const { error } = await supabase
    .from("bookings")
    .insert([{ name, phone, car }]);

  if (error) {
    alert("Error: " + error.message);
  } else {
    alert("Booking saved successfully!");
  }
}
    
  </script>
</html>
